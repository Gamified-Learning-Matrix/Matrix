<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gemini CLI Terminal - Nexus OS secure connection interface">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="theme-color" content="#0d0d1a">
    <title>Gemini CLI Terminal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
        :root {
            --bg-color: #0d0d1a;
            --text-color: #00ff41; /* Cyber-green */
            --font-main: 'Courier New', Courier, monospace;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #terminal-output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.4);
        }
        .input-line {
            display: flex;
            align-items: center;
        }
        .prompt {
            margin-right: 10px;
            font-weight: bold;
        }
        #cli-input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: var(--font-main);
            font-size: 1rem;
            flex-grow: 1;
            outline: none;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.4);
        }
        .user-cmd { color: #aaa; }
        .system-response { color: var(--text-color); margin-bottom: 10px; line-height: 1.6; }
        .error-response { color: #ff3333; margin-bottom: 10px; }
        .success-response { color: #00ff41; margin-bottom: 10px; }
        .info-response { color: #00cfff; margin-bottom: 10px; }
        .warning-response { color: #ffaa00; margin-bottom: 10px; }
        .gemini-response { color: #b48fe0; margin-bottom: 10px; line-height: 1.6; border-left: 2px solid #7851a9; padding-left: 10px; }
    </style>
</head>
<body>

    <div id="terminal-output">
        <div>Nexus OS [Version 1.0.2]</div>
        <div>(c) 2026 Enterprise Architecture. All rights reserved.</div><br>
        <div>Initializing secure connection to Gemini Proxy...</div><br>
    </div>

    <div class="input-line">
        <span class="prompt">admin@nexus:~$</span>
        <input type="text" id="cli-input" autocomplete="off" autofocus>
    </div>

    <noscript>
        <p>This application requires JavaScript to be enabled.</p>
    </noscript>

    <script>
        const inputField = document.getElementById('cli-input');
        const outputDiv = document.getElementById('terminal-output');

        // GitHub Configuration
        let GITHUB_TOKEN = localStorage.getItem('github_token') || null;
        const REPO_OWNER = 'Gamified-Learning-Matrix';
        const REPO_NAME = 'Nexus';

        // Gemini API configuration
        const GEMINI_API_KEY = localStorage.getItem('gemini_api_key') || null;
        const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent';

        // Gemini state
        let geminiState = {
            installed: localStorage.getItem('gemini_installed') === 'true',
            version: localStorage.getItem('gemini_version') || '0.0.0',
            lastSync: localStorage.getItem('gemini_last_sync') || 'Never'
        };

        // Built-in commands
        const COMMANDS = {
            'help': () => {
                return `Available Commands:
  help                           - Display this help message
  clear                          - Clear terminal output
  status                         - Check Nexus OS system status
  version                        - Display system version
  echo <text>                    - Echo text to terminal
  date                           - Display current date and time
  whoami                         - Display current user
  about                          - About Nexus OS
  install-gemini                 - Install/initialize Gemini
  gemini <prompt>                - Query Gemini AI directly
  gemini --install               - Install Gemini with API key
  gemini --status                - Check Gemini status
  gemini --push <message>        - Push changes to repository
  github-auth <token>            - Authenticate with GitHub token
  exit                           - Exit terminal (closes window)`;
            },
            'status': () => {
                return `Nexus OS Status Report:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
System: Operational
Uptime: 42 days, 13 hours, 29 minutes
Memory: 2048MB allocated
CPU: 4 cores @ 2.4GHz
Connections: 1 active
Services: Gemini Proxy (active), Star Road (active)
Gemini: ${geminiState.installed ? 'Installed v' + geminiState.version : 'Not installed'}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;
            },
            'version': () => {
                return `Nexus OS Version 1.0.2
Released: 2026-01-15
Build: 1234567890
Architecture: x64-nexus
Gemini Version: ${geminiState.version}`;
            },
            'whoami': () => {
                return `admin@nexus (GulfNexus)`;
            },
            'date': () => {
                return new Date().toString();
            },
            'about': () => {
                return `Nexus OS - Gamified Learning Matrix Terminal
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
The Nexus OS CLI Terminal provides secure access to the
Gamified Learning Matrix ecosystem through Gemini AI integration.
Part of the Star Road Portal initiative.

Developed by: GulfNexus
License: CC0 1.0 Universal
GitHub: Gamified-Learning-Matrix/Nexus`;
            },
            'exit': () => {
                window.close();
                return `Closing terminal...`;
            }
        };

        async function installGemini(apiKey) {
            if (!apiKey) {
                return `❌ API key required. Usage: gemini --install <your_api_key>`;
            }

            printLine("🚀 Installing Gemini...", "info-response");
            
            const steps = [
                { msg: "Downloading Gemini Core...", delay: 800 },
                { msg: "Configuring AI modules...", delay: 1200 },
                { msg: "Initializing Geno Beam telemetry...", delay: 900 },
                { msg: "Setting up Star Road integration...", delay: 1000 },
                { msg: "Validating API key...", delay: 700 }
            ];

            for (const step of steps) {
                printLine(`▶ ${step.msg}`, "info-response");
                await sleep(step.delay);
            }

            // Save installation state
            geminiState.installed = true;
            geminiState.version = '1.0.0';
            geminiState.lastSync = new Date().toLocaleString();
            localStorage.setItem('gemini_installed', 'true');
            localStorage.setItem('gemini_version', '1.0.0');
            localStorage.setItem('gemini_last_sync', geminiState.lastSync);
            localStorage.setItem('gemini_api_key', apiKey);

            return `✅ Gemini v1.0.0 installed successfully!
API Key stored securely.
Ready to use: gemini <your_question>`;
        }

        function getGeminiStatus() {
            if (!geminiState.installed) {
                return `❌ Gemini not installed.\nRun: gemini --install <your_api_key>`;
            }
            return `✅ Gemini Status:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
Version: ${geminiState.version}
Status: Operational
API Key: ${localStorage.getItem('gemini_api_key') ? '***configured***' : 'Not configured'}
Last Sync: ${geminiState.lastSync}
Repository: ${REPO_OWNER}/${REPO_NAME}
GitHub Auth: ${GITHUB_TOKEN ? '✓ Authenticated' : '✗ Not authenticated'}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;
        }

        async function queryGemini(prompt) {
            if (!geminiState.installed) {
                return `❌ Gemini not installed. Run: gemini --install <your_api_key>`;
            }

            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                return `❌ Gemini API key not found. Run: gemini --install <your_api_key>`;
            }

            printLine("🤖 Querying Gemini...", "info-response");

            try {
                const response = await fetch(`${GEMINI_API_URL}?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    return `❌ Gemini Error: ${error.error?.message || 'API request failed'}`;
                }

                const data = await response.json();
                const result = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response from Gemini';
                return result;
            } catch (error) {
                return `❌ Connection error: ${error.message}`;
            }
        }

        async function pushToRepository(message) {
            if (!GITHUB_TOKEN) {
                return `❌ GitHub authentication required. Run: github-auth <token>`;
            }
            if (!message) {
                return `❌ Commit message required. Usage: gemini --push <message>`;
            }

            printLine("📤 Pushing changes to repository...", "info-response");

            try {
                printLine("▶ Staging changes...", "info-response");
                await sleep(500);
                printLine("▶ Creating commit...", "info-response");
                await sleep(800);
                printLine("▶ Pushing to origin/main...", "info-response");
                await sleep(1000);

                const timestamp = new Date().toISOString();
                const content = btoa(`# Gemini Update\n\nTimestamp: ${timestamp}\nMessage: ${message}\n\nUpdated by Nexus OS CLI\nUser: admin@nexus`);

                const response = await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/GEMINI_LOG.md`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            content: content,
                            branch: 'main'
                        })
                    }
                );

                if (response.ok) {
                    const data = await response.json();
                    geminiState.lastSync = new Date().toLocaleString();
                    localStorage.setItem('gemini_last_sync', geminiState.lastSync);
                    return `✅ Successfully pushed to ${REPO_OWNER}/${REPO_NAME}
Commit: ${data.content.sha.substring(0, 8)}
Message: "${message}"`;
                } else {
                    const errorData = await response.json();
                    return `❌ Push failed: ${errorData.message || 'Unknown error'}`;
                }
            } catch (error) {
                return `❌ Push error: ${error.message}`;
            }
        }

        async function handleGitHubAuth(token) {
            if (!token) {
                return `❌ Token required. Usage: github-auth <your_github_token>`;
            }

            printLine("🔐 Authenticating with GitHub...", "info-response");
            
            try {
                const response = await fetch('https://api.github.com/user', {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (response.ok) {
                    const user = await response.json();
                    GITHUB_TOKEN = token;
                    localStorage.setItem('github_token', token);
                    return `✅ Authenticated as @${user.login}
Token saved to local storage.
Ready to push changes!`;
                } else {
                    return `❌ Authentication failed. Invalid token.`;
                }
            } catch (error) {
                return `❌ Auth error: ${error.message}`;
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        inputField.addEventListener('keydown', async function(e) {
            if (e.key === 'Enter') {
                const command = inputField.value.trim();
                if (!command) return;

                printLine(`admin@nexus:~$ ${command}`, 'user-cmd');
                inputField.value = '';
                inputField.disabled = true;

                if (command.toLowerCase() === 'clear') {
                    outputDiv.innerHTML = '';
                    inputField.disabled = false;
                    inputField.focus();
                    return;
                }

                const parts = command.split(/\s+/);
                const cmd = parts[0].toLowerCase();
                const args = parts.slice(1);
                const fullArgs = parts.slice(1).join(' ');

                // Built-in commands
                if (COMMANDS[cmd]) {
                    const result = COMMANDS[cmd]();
                    printLine(result, 'system-response');
                    inputField.disabled = false;
                    inputField.focus();
                    scrollToBottom();
                    return;
                }

                // Echo command
                if (cmd === 'echo') {
                    printLine(fullArgs, 'system-response');
                    inputField.disabled = false;
                    inputField.focus();
                    scrollToBottom();
                    return;
                }

                // Install Gemini
                if (cmd === 'install-gemini') {
                    const result = await installGemini(args[0]);
                    printLine(result, 'success-response');
                    inputField.disabled = false;
                    inputField.focus();
                    scrollToBottom();
                    return;
                }

                // Gemini command (main handler)
                if (cmd === 'gemini') {
                    let result;
                    
                    if (args[0] === '--install') {
                        result = await installGemini(args[1]);
                        printLine(result, 'success-response');
                    } else if (args[0] === '--status') {
                        result = getGeminiStatus();
                        printLine(result, 'info-response');
                    } else if (args[0] === '--push') {
                        const msg = args.slice(1).join(' ');
                        result = await pushToRepository(msg);
                        printLine(result, 'success-response');
                    } else if (fullArgs) {
                        // Direct Gemini query
                        result = await queryGemini(fullArgs);
                        printLine(result, 'gemini-response');
                    } else {
                        result = `Usage: gemini <prompt> | gemini --install <api_key> | gemini --status | gemini --push <message>`;
                        printLine(result, 'info-response');
                    }

                    inputField.disabled = false;
                    inputField.focus();
                    scrollToBottom();
                    return;
                }

                // GitHub auth command
                if (cmd === 'github-auth') {
                    const result = await handleGitHubAuth(args[0]);
                    printLine(result, 'success-response');
                    inputField.disabled = false;
                    inputField.focus();
                    scrollToBottom();
                    return;
                }

                // Unknown command
                printLine(`Command not found: ${cmd}. Type 'help' for available commands.`, 'error-response');
                inputField.disabled = false;
                inputField.focus();
                scrollToBottom();
            }
        });

        function printLine(text, className) {
            const div = document.createElement('div');
            div.className = className;
            div.textContent = text;
            outputDiv.appendChild(div);
            scrollToBottom();
        }

        function scrollToBottom() {
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        document.addEventListener('click', () => inputField.focus());
    </script>
</body>
</html>
